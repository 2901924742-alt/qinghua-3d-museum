<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>青花瓷数字博物馆</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
overflow:hidden;
background:radial-gradient(circle at top,#1b2a41 0%,#050505 65%);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}

canvas{display:block;}

.loading{
position:fixed;inset:0;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
color:white;
font-size:20px;
z-index:999;
letter-spacing:2px;
transition:.6s;
}

.title{
position:fixed;
top:24px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:30px;
font-weight:600;
letter-spacing:6px;
z-index:10;
text-shadow:0 0 30px rgba(0,0,0,.5);
}

.sub{
position:fixed;
top:66px;
left:50%;
transform:translateX(-50%);
color:rgba(255,255,255,.55);
font-size:12px;
letter-spacing:4px;
z-index:10;
}

.info{
position:fixed;
left:30px;
bottom:30px;
width:360px;
padding:26px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:24px;
color:white;
z-index:10;
}

.info h2{
font-size:28px;
margin-bottom:12px;
}

.info p{
font-size:14px;
line-height:2;
opacity:.78;
}

.tip{
position:fixed;
right:30px;
bottom:30px;
color:rgba(255,255,255,.45);
font-size:13px;
}
</style>
</head>

<body>

<div class="loading" id="loading">正在进入数字展馆...</div>

<div class="title">青花瓷数字博物馆</div>
<div class="sub">QINGHUA PORCELAIN DIGITAL MUSEUM</div>

<div class="info">
<h2>元代青花瓷</h2>
<p>
元代青花瓷是中国陶瓷史的重要高峰，  
以进口钴料绘制蓝色纹饰，釉下高温烧制。<br><br>

造型端庄、纹样繁复，具有极高艺术价值。<br><br>

数字展馆基于 Three.js 构建实时渲染空间。
</p >
</div>

<div class="tip">点击屏幕切换自动旋转</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =====================
   场景
===================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 6, 18);

/* =====================
   相机（开场远）
===================== */
const camera = new THREE.PerspectiveCamera(
45, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0, 1.5, 10);

/* =====================
   渲染器
===================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

/* =====================
   控制器
===================== */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.maxPolarAngle = Math.PI / 1.2;
controls.minDistance = 2;
controls.maxDistance = 8;

/* =====================
   灯光系统
===================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
mainLight.position.set(5, 8, 5);
scene.add(mainLight);

const blueLight = new THREE.PointLight(0x4da6ff, 1.5, 20);
blueLight.position.set(-4, 3, 3);
scene.add(blueLight);

const glowLight = new THREE.PointLight(0xffffff, 1, 25);
glowLight.position.set(0, 2, 0);
scene.add(glowLight);

/* =====================
   展台
===================== */
const podium = new THREE.Mesh(
new THREE.CylinderGeometry(1.25, 1.45, 0.6, 64),
new THREE.MeshStandardMaterial({
color: 0x111111,
roughness: 0.25,
metalness: 0.4
})
);
podium.position.y = -1.05;
scene.add(podium);

/* =====================
   粒子系统
===================== */
const geo = new THREE.BufferGeometry();
const count = 1800;
const pos = [];

for(let i=0;i<count;i++){
pos.push((Math.random()-0.5)*20);
pos.push(Math.random()*10);
pos.push((Math.random()-0.5)*20);
}

geo.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));

const particles = new THREE.Points(
geo,
new THREE.PointsMaterial({
size:0.02,
transparent:true,
opacity:0.35
})
);

scene.add(particles);

/* =====================
   GLB模型
===================== */
const loader = new GLTFLoader();

loader.load("./qinghuaci.glb",(gltf)=>{

const model = gltf.scene;
scene.add(model);

/* bounding box */
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());

/* scale */
const maxSize = Math.max(size.x,size.y,size.z);
const scale = 1.8 / maxSize;
model.scale.setScalar(scale);

/* rebox */
const newBox = new THREE.Box3().setFromObject(model);
const newCenter = newBox.getCenter(new THREE.Vector3());
const minY = newBox.min.y;

/* center */
model.position.x -= newCenter.x;
model.position.z -= newCenter.z;

/* ⭐ 最终稳定 + +0.28 */
model.position.y -= minY;
model.position.y += (-1.05 + 0.28);

/* 材质优化 */
model.traverse(obj=>{
if(obj.isMesh){
obj.castShadow = true;
obj.receiveShadow = true;
if(obj.material){
obj.material.roughness = 0.22;
obj.material.metalness = 0.05;
}
}
});

/* 开场动画 */
let t = 0;

function intro(){
t += 0.008;
camera.position.z = 10 - t * 4;
camera.position.y = 1.5 - t * 0.3;
if(t < 1) requestAnimationFrame(intro);
}
intro();

/* loading */
document.getElementById("loading").style.display="none";

});

/* =====================
   动画循环
===================== */
function animate(){
requestAnimationFrame(animate);

controls.update();

/* 粒子旋转 */
particles.rotation.y += 0.0002;

/* 呼吸光 */
glowLight.intensity =
0.8 + Math.sin(Date.now()*0.001)*0.3;

renderer.render(scene,camera);
}

animate();

/* =====================
   resize
===================== */
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
