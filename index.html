<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>青花瓷数字博物馆</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
overflow:hidden;
background:radial-gradient(circle at top,#1b2a41 0%,#050505 65%);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}

canvas{display:block;}

.loading{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#050505;color:white;
font-size:20px;z-index:999;
letter-spacing:2px;transition:.6s;
}

.title{
position:fixed;top:24px;left:50%;
transform:translateX(-50%);
color:white;font-size:30px;font-weight:600;
letter-spacing:6px;z-index:10;
text-shadow:0 0 30px rgba(0,0,0,.5);
}

.sub{
position:fixed;top:66px;left:50%;
transform:translateX(-50%);
color:rgba(255,255,255,.55);
font-size:12px;letter-spacing:4px;
z-index:10;
}

.info{
position:fixed;left:30px;bottom:30px;
width:320px;padding:26px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:24px;
color:white;z-index:10;
transition:.3s;
}

.info:hover{
transform:translateY(-4px);
background:rgba(255,255,255,.08);
}

.info h2{font-size:28px;margin-bottom:12px;font-weight:600;}
.info p{font-size:14px;line-height:2;opacity:.75;}

.tip{
position:fixed;right:30px;bottom:30px;
color:rgba(255,255,255,.45);
font-size:13px;
letter-spacing:2px;
z-index:10;
}
</style>
</head>

<body>

<div class="loading" id="loading">正在进入数字展馆...</div>

<div class="title">青花瓷数字博物馆</div>
<div class="sub">QINGHUA PORCELAIN DIGITAL MUSEUM</div>

<div class="info">
<h2>元代青花瓷</h2>
<p>
青花瓷融合东方美学与传统工艺。<br><br>
基于 Three.js 实时渲染。
</p >
</div>

<div class="tip">点击屏幕可切换旋转</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* 场景 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

/* 相机 */
const camera = new THREE.PerspectiveCamera(
45, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0,1.2,6);

/* 渲染器 */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* 控制器 */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;

/* 灯光 */
scene.add(new THREE.AmbientLight(0xffffff,1.2));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,8,5);
scene.add(light);

/* 展台 */
const podium = new THREE.Mesh(
new THREE.CylinderGeometry(1.25,1.45,0.6,64),
new THREE.MeshStandardMaterial({color:0x111111,roughness:0.2})
);
podium.position.y = -1.05;
scene.add(podium);

/* loader */
const loader = new GLTFLoader();

loader.load("./qinghuaci.glb",(gltf)=>{

const model = gltf.scene;
scene.add(model);

/* bounding box */
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());

/* scale */
const maxSize = Math.max(size.x,size.y,size.z);
const scale = 1.8 / maxSize;
model.scale.setScalar(scale);

/* re-box after scale */
const newBox = new THREE.Box3().setFromObject(model);
const newCenter = newBox.getCenter(new THREE.Vector3());
const minY = newBox.min.y;

/* position fix */
model.position.x -= newCenter.x;
model.position.z -= newCenter.z;

/* ⭐ 核心：贴展台 + 轻微高级托起（+0.05 已整合） */
model.position.y -= minY;
model.position.y += (-1.05 + 0.05);

/* controls center */
controls.target.set(0,0.2,0);
controls.update();

/* loading */
document.getElementById("loading").style.display="none";

});

/* animate */
function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();

/* resize */
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
