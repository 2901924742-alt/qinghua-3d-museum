<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>青花瓷数字博物馆</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;

background:
radial-gradient(circle at top,#1b2a41 0%,#050505 65%);

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;
}

canvas{
display:block;
}

.loading{
position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;

background:#050505;

color:white;

font-size:20px;

z-index:999;

letter-spacing:2px;

transition:.6s;
}

.title{

position:fixed;

top:24px;
left:50%;

transform:translateX(-50%);

color:white;

font-size:30px;

font-weight:600;

letter-spacing:6px;

z-index:10;

text-shadow:0 0 30px rgba(0,0,0,.5);
}

.sub{

position:fixed;

top:66px;
left:50%;

transform:translateX(-50%);

color:rgba(255,255,255,.55);

font-size:12px;

letter-spacing:4px;

z-index:10;
}

.info{

position:fixed;

left:30px;
bottom:30px;

width:320px;

padding:26px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:24px;

color:white;

z-index:10;

transition:.3s;
}

.info:hover{

transform:translateY(-4px);

background:rgba(255,255,255,.08);
}

.info h2{

font-size:28px;

margin-bottom:12px;

font-weight:600;
}

.info p{

font-size:14px;

line-height:2;

opacity:.75;
}

.tip{

position:fixed;

right:30px;
bottom:30px;

color:rgba(255,255,255,.45);

font-size:13px;

letter-spacing:2px;

z-index:10;
}

.glow{

position:fixed;

width:520px;
height:520px;

background:
radial-gradient(circle,
rgba(77,166,255,.16) 0%,
transparent 70%);

filter:blur(100px);

top:-120px;
right:-120px;

pointer-events:none;

z-index:0;
}

@media (max-width:768px){

.title{
font-size:22px;
top:18px;
}

.sub{
top:50px;
font-size:10px;
}

.info{
left:16px;
bottom:16px;
width:calc(100% - 32px);
padding:20px;
}

.tip{
display:none;
}

}

</style>
</head>

<body>

<div class="loading" id="loading">
正在进入数字展馆...
</div>

<div class="glow"></div>

<div class="title">
青花瓷数字博物馆
</div>

<div class="sub">
QINGHUA PORCELAIN DIGITAL MUSEUM
</div>

<div class="info">

<h2>元代青花瓷</h2>

<p>
青花瓷融合东方美学与传统工艺，
以钴蓝纹饰与温润釉色闻名。<br><br>

本数字展馆基于 Three.js
实时渲染技术构建，
实现沉浸式文物展示体验。
</p >

</div>

<div class="tip">
点击屏幕可暂停自动旋转
</div>

<!-- importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

//////////////////////////////////////////////////
// 场景
//////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x050505);

scene.fog =
new THREE.Fog(
0x050505,
8,
18
);

//////////////////////////////////////////////////
// 相机
//////////////////////////////////////////////////

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,1.2,6);

//////////////////////////////////////////////////
// 渲染器
//////////////////////////////////////////////////

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:true

});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
renderer.domElement);

//////////////////////////////////////////////////
// 控制器
//////////////////////////////////////////////////

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.autoRotate = true;

controls.autoRotateSpeed = 0.55;

// ⭐ 更自然的观看限制（高级感）
controls.maxPolarAngle =
Math.PI / 1.15;

controls.minPolarAngle =
0.15;

controls.minDistance = 2;

controls.maxDistance = 8;

//////////////////////////////////////////////////
// 灯光
//////////////////////////////////////////////////

const ambient =
new THREE.AmbientLight(
0xffffff,
1.15
);

scene.add(ambient);

const mainLight =
new THREE.DirectionalLight(
0xffffff,
2.4
);

mainLight.position.set(5,8,5);

mainLight.castShadow = true;

mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;

scene.add(mainLight);

const blueLight =
new THREE.PointLight(
0x4da6ff,
2,
20
);

blueLight.position.set(-4,3,3);

scene.add(blueLight);

const rimLight =
new THREE.PointLight(
0xffffff,
1.5,
20
);

rimLight.position.set(3,2,-3);

scene.add(rimLight);

//////////////////////////////////////////////////
// 展台
//////////////////////////////////////////////////

const podium =
new THREE.Mesh(

new THREE.CylinderGeometry(
1.25,
1.45,
0.6,
64
),

new THREE.MeshStandardMaterial({

color:0x111111,

roughness:0.18,

metalness:0.45

})

);

podium.position.y = -1.05;

podium.receiveShadow = true;

scene.add(podium);

//////////////////////////////////////////////////
// 地面
//////////////////////////////////////////////////

const floor =
new THREE.Mesh(

new THREE.CircleGeometry(
20,
64
),

new THREE.MeshStandardMaterial({

color:0x0a0a0a,

roughness:0.28,

metalness:0.1

})

);

floor.rotation.x = -Math.PI/2;

floor.position.y = -1.35;

floor.receiveShadow = true;

scene.add(floor);

//////////////////////////////////////////////////
// 漂浮粒子
//////////////////////////////////////////////////

const particlesGeometry =
new THREE.BufferGeometry();

const particleCount = 1200;

const positions = [];

for(let i=0;i<particleCount;i++){

positions.push(
(Math.random()-0.5)*18
);

positions.push(
Math.random()*8
);

positions.push(
(Math.random()-0.5)*18
);

}

particlesGeometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(
positions,
3
)
);

const particlesMaterial =
new THREE.PointsMaterial({

size:0.02,

transparent:true,

opacity:0.35,

color:0xffffff

});

const particles =
new THREE.Points(
particlesGeometry,
particlesMaterial
);

scene.add(particles);

//////////////////////////////////////////////////
// GLB加载
//////////////////////////////////////////////////

const loader =
new GLTFLoader();

loader.load(

"./qinghuaci.glb",

(gltf)=>{

const model = gltf.scene;

scene.add(model);

//////////////////////////////////////////////////
// 包围盒
//////////////////////////////////////////////////

const box =
new THREE.Box3()
.setFromObject(model);

const size =
box.getSize(
new THREE.Vector3()
);

const center =
box.getCenter(
new THREE.Vector3()
);

//////////////////////////////////////////////////
// 缩放
//////////////////////////////////////////////////

const maxSize =
Math.max(
size.x,
size.y,
size.z
);

const scale =
1.8 / maxSize;

model.scale.set(
scale,
scale,
scale
);

//////////////////////////////////////////////////
// scale后重新计算
//////////////////////////////////////////////////

const newBox =
new THREE.Box3()
.setFromObject(model);

const newCenter =
newBox.getCenter(
new THREE.Vector3()
);

//////////////////////////////////////////////////
// 真正居中
//////////////////////////////////////////////////

model.position.x -= newCenter.x;

model.position.y -= newCenter.y;

model.position.z -= newCenter.z;

//////////////////////////////////////////////////
// 放到展台上
//////////////////////////////////////////////////

model.position.y -= 0.12;

//////////////////////////////////////////////////
// 材质增强
//////////////////////////////////////////////////

model.traverse((obj)=>{

if(obj.isMesh){

obj.castShadow = true;

obj.receiveShadow = true;

if(obj.material){

obj.material.roughness = 0.22;

obj.material.metalness = 0.04;

obj.material.needsUpdate = true;

}

}

});

//////////////////////////////////////////////////
// controls中心
//////////////////////////////////////////////////

controls.target.set(0,0.2,0);

controls.update();

//////////////////////////////////////////////////
// 开场镜头动画
//////////////////////////////////////////////////

camera.position.set(0,1.2,8);

let intro = 0;

function introAnimation(){

if(intro < 1){

intro += 0.008;

camera.position.z =
8 - intro * 2.8;

requestAnimationFrame(
introAnimation
);

}

}

introAnimation();

//////////////////////////////////////////////////
// loading消失
//////////////////////////////////////////////////

document.getElementById(
"loading"
).style.opacity = "0";

setTimeout(()=>{

document.getElementById(
"loading"
).style.display = "none";

},600);

},

undefined,

(error)=>{

console.error(
"模型加载失败",
error
);

document.getElementById(
"loading"
).innerHTML =
"模型加载失败";

}

);

//////////////////////////////////////////////////
// 点击暂停旋转
//////////////////////////////////////////////////

let autoRotate = true;

window.addEventListener(
"click",
()=>{

autoRotate = !autoRotate;

controls.autoRotate = autoRotate;

}
);

//////////////////////////////////////////////////
// 动画
//////////////////////////////////////////////////

function animate(){

requestAnimationFrame(animate);

controls.update();

particles.rotation.y += 0.00025;

renderer.render(
scene,
camera
);

}

animate();

//////////////////////////////////////////////////
// 自适应
//////////////////////////////////////////////////

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
