<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>青花瓷数字博物馆</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
overflow:hidden;
background:radial-gradient(circle at top,#1b2a41 0%,#050505 70%);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}

canvas{display:block;}

.loading{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#050505;color:white;
font-size:20px;z-index:999;
}

.title{
position:fixed;top:24px;left:50%;
transform:translateX(-50%);
color:white;font-size:30px;font-weight:600;
z-index:10;
}

.sub{
position:fixed;top:66px;left:50%;
transform:translateX(-50%);
color:rgba(255,255,255,.55);
font-size:12px;
z-index:10;
}

.info{
position:fixed;left:30px;bottom:30px;
width:360px;padding:26px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:24px;
color:white;
}

.tip{
position:fixed;right:30px;bottom:30px;
color:rgba(255,255,255,.45);
font-size:13px;
}
</style>
</head>

<body>

<div class="loading" id="loading">正在进入数字展馆...</div>

<div class="title">青花瓷数字博物馆</div>
<div class="sub">QINGHUA PORCELAIN DIGITAL MUSEUM</div>

<div class="info">
<h2>元代青花瓷</h2>
<p>数字化展览基于 Three.js 实时渲染。</p >
</div>

<div class="tip">点击切换自动旋转</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =====================
   场景
===================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 6, 18);

/* =====================
   相机
===================== */
const camera = new THREE.PerspectiveCamera(
45, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0, 1.4, 10);

/* =====================
   渲染器
===================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

/* =====================
   控制器
===================== */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;

/* =====================
   🌟 光效升级（重点修复）
===================== */

/* 1. 环境基础光（防黑） */
scene.add(new THREE.AmbientLight(0xffffff, 1.1));

/* 2. 主方向光（略侧打光） */
const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
mainLight.position.set(6, 8, 4);
scene.add(mainLight);

/* 3. 底部补光（解决展台发黑关键） */
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(-3, -2, 3);
scene.add(fillLight);

/* 4. 蓝色氛围光 */
const blueLight = new THREE.PointLight(0x4da6ff, 1.6, 25);
blueLight.position.set(-4, 3, 3);
scene.add(blueLight);

/* 5. 展台底部柔光环（关键） */
const ringLight = new THREE.PointLight(0xffffff, 1.2, 8);
ringLight.position.set(0, -0.8, 0);
scene.add(ringLight);

/* =====================
   展台
===================== */
const podium = new THREE.Mesh(
new THREE.CylinderGeometry(1.25,1.45,0.6,64),
new THREE.MeshStandardMaterial({
color:0x111111,
roughness:0.25,
metalness:0.4
})
);
podium.position.y = -1.05;
scene.add(podium);

/* =====================
   粒子（轻微增强亮度）
===================== */
const geo = new THREE.BufferGeometry();
const count = 1600;
const pos = [];

for(let i=0;i<count;i++){
pos.push((Math.random()-0.5)*20);
pos.push(Math.random()*10);
pos.push((Math.random()-0.5)*20);
}

geo.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));

const particles = new THREE.Points(
geo,
new THREE.PointsMaterial({
size:0.02,
transparent:true,
opacity:0.45   // ⭐ 提亮一点
})
);

scene.add(particles);

/* =====================
   GLB加载
===================== */
const loader = new GLTFLoader();

loader.load("./qinghuaci.glb",(gltf)=>{

const model = gltf.scene;
scene.add(model);

/* bounding box */
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());

const maxSize = Math.max(size.x,size.y,size.z);
const scale = 1.8 / maxSize;
model.scale.setScalar(scale);

/* rebox */
const newBox = new THREE.Box3().setFromObject(model);
const newCenter = newBox.getCenter(new THREE.Vector3());
const minY = newBox.min.y;

/* center */
model.position.x -= newCenter.x;
model.position.z -= newCenter.z;

/* ⭐ 展台贴合 + +0.28 */
model.position.y -= minY;
model.position.y += (-1.05 + 0.28);

/* 材质优化 */
model.traverse(obj=>{
if(obj.isMesh){
obj.castShadow = true;
obj.receiveShadow = true;
if(obj.material){
obj.material.roughness = 0.22;
obj.material.metalness = 0.05;
}
}
});

/* loading */
document.getElementById("loading").style.display="none";

});

/* =====================
   动画
===================== */
function animate(){
requestAnimationFrame(animate);

controls.update();

/* 粒子轻微旋转 */
particles.rotation.y += 0.0002;

renderer.render(scene,camera);
}

animate();

/* =====================
   resize
===================== */
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
