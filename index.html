<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>青花瓷数字博物馆</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#050505;
font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;
}

canvas{
display:block;
}

.title{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:24px;
letter-spacing:4px;
z-index:10;
text-shadow:0 0 20px rgba(0,0,0,.5);
}

.loading{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
color:white;
background:#050505;
z-index:99;
font-size:18px;
}

.info{
position:fixed;
left:20px;
bottom:20px;
padding:18px 22px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
color:white;
width:260px;
z-index:10;
}

.info h2{
font-size:20px;
margin-bottom:10px;
}

.info p{
font-size:13px;
line-height:1.8;
opacity:.75;
}

@media (max-width:768px){

.title{
font-size:18px;
top:16px;
}

.info{
width:calc(100% - 40px);
}

}

</style>
</head>

<body>

<div class="loading" id="loading">
正在加载数字展馆...
</div>

<div class="title">
青花瓷数字博物馆
</div>

<div class="info">
<h2>元代青花瓷</h2>

<p>
采用 Three.js 实时渲染技术，
实现文物数字化展示与沉浸式交互体验。
</p >
</div>

<!-- importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

//////////////////////////////////////////////////
// 场景
//////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x050505);

scene.fog =
new THREE.Fog(0x050505, 6, 14);

//////////////////////////////////////////////////
// 相机
//////////////////////////////////////////////////

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0, 1.2, 4);

//////////////////////////////////////////////////
// 渲染器
//////////////////////////////////////////////////

const renderer =
new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

document.body.appendChild(
renderer.domElement
);

//////////////////////////////////////////////////
// 控制器
//////////////////////////////////////////////////

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.autoRotate = true;

controls.autoRotateSpeed = 0.8;

// ⭐ 防止只能看到顶部
controls.maxPolarAngle = Math.PI / 1.9;

controls.minPolarAngle = Math.PI / 3.5;

//////////////////////////////////////////////////
// 灯光
//////////////////////////////////////////////////

const ambient =
new THREE.AmbientLight(
0xffffff,
1.2
);

scene.add(ambient);

const mainLight =
new THREE.DirectionalLight(
0xffffff,
2
);

mainLight.position.set(5,8,5);

scene.add(mainLight);

const blueLight =
new THREE.PointLight(
0x4da6ff,
1.5,
20
);

blueLight.position.set(-3,2,2);

scene.add(blueLight);

//////////////////////////////////////////////////
// 地面（增强空间感）
// //////////////////////////////////////////////////

const floor =
new THREE.Mesh(

new THREE.CircleGeometry(10,64),

new THREE.MeshStandardMaterial({

color:0x111111,

roughness:0.2,

metalness:0.1

})

);

floor.rotation.x = -Math.PI/2;

floor.position.y = -1.1;

scene.add(floor);

//////////////////////////////////////////////////
// GLB加载
//////////////////////////////////////////////////

const loader = new GLTFLoader();

loader.load(

"./qinghuaci.glb",

(gltf)=>{

const model = gltf.scene;

scene.add(model);

console.log("模型加载成功");

// ==============================
// 1. 先计算包围盒
// ==============================

const box =
new THREE.Box3().setFromObject(model);

const size =
box.getSize(new THREE.Vector3());

const center =
box.getCenter(new THREE.Vector3());

// ==============================
// 2. 缩放（先scale）
// ==============================

const maxSize =
Math.max(
size.x,
size.y,
size.z
);

const scale =
1.8 / maxSize;

model.scale.set(
scale,
scale,
scale
);

// ==============================
// 3. scale后重新计算
// ==============================

const newBox =
new THREE.Box3().setFromObject(model);

const newCenter =
newBox.getCenter(
new THREE.Vector3()
);

// ==============================
// 4. 真正居中
// ==============================

model.position.x -= newCenter.x;

model.position.y -= newCenter.y;

model.position.z -= newCenter.z;

// ==============================
// 5. 微调高度
// ==============================

model.position.y -= 0.2;

// ==============================
// 6. 材质增强
// ==============================

model.traverse((obj)=>{

if(obj.isMesh){

obj.castShadow = true;

obj.receiveShadow = true;

if(obj.material){

obj.material.roughness = 0.28;

obj.material.metalness = 0.05;

obj.material.needsUpdate = true;

}

}

});

// ==============================
// 7. ⭐ 关键：控制器中心
// ==============================

controls.target.set(0,0.5,0);

controls.update();

// ==============================
// 8. 隐藏loading
// ==============================

document.getElementById(
"loading"
).style.display = "none";

},

(xhr)=>{

if(xhr.total){

const percent =
(xhr.loaded / xhr.total * 100)
.toFixed(0);

document.getElementById(
"loading"
).innerHTML =
`正在加载 ${percent}%`;

}

},

(error)=>{

console.error("模型加载失败", error);

document.getElementById(
"loading"
).innerHTML =
"模型加载失败";

}

);

//////////////////////////////////////////////////
// 动画
//////////////////////////////////////////////////

function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

//////////////////////////////////////////////////
// 自适应
//////////////////////////////////////////////////

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
