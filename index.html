<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>青花瓷数字博物馆</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#050505;
font-family:sans-serif;
}

canvas{
display:block;
}

.title{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:22px;
z-index:10;
}
</style>
</head>

<body>

<div class="title">青花瓷数字博物馆</div>

<!-- ⭐ importmap（关键） -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls }
from "three/addons/controls/OrbitControls.js";

import { GLTFLoader }
from "three/addons/loaders/GLTFLoader.js";

//////////////////////////////////////////////////
// 场景
//////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

//////////////////////////////////////////////////
// 相机
//////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0,1.5,3);

//////////////////////////////////////////////////
// 渲染器
//////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(
renderer.domElement
);

//////////////////////////////////////////////////
// 控制器（正确module写法）
// ⭐ 不再是 THREE.OrbitControls
//////////////////////////////////////////////////

const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

controls.autoRotate = true;

controls.autoRotateSpeed = 0.8;

controls.target.set(0,0,0);

//////////////////////////////////////////////////
// 灯光
//////////////////////////////////////////////////

const ambient =
new THREE.AmbientLight(
0xffffff,
1.2
);

scene.add(ambient);

const dirLight =
new THREE.DirectionalLight(
0xffffff,
1.5
);

dirLight.position.set(5,8,5);

scene.add(dirLight);

//////////////////////////////////////////////////
// GLB加载
//////////////////////////////////////////////////

const loader = new GLTFLoader();

loader.load(

"./qinghuaci.glb",

(gltf)=>{

const model = gltf.scene;

scene.add(model);

console.log("模型加载成功");

//////////////////////////////////////////////////
// 包围盒
//////////////////////////////////////////////////

const box =
new THREE.Box3()
.setFromObject(model);

const center =
box.getCenter(
new THREE.Vector3()
);

const size =
box.getSize(
new THREE.Vector3()
);

//////////////////////////////////////////////////
// 居中
//////////////////////////////////////////////////

model.position.sub(center);

//////////////////////////////////////////////////
// 缩放
//////////////////////////////////////////////////

const maxSize =
Math.max(
size.x,
size.y,
size.z
);

const scale =
2.5 / maxSize;

model.scale.setScalar(scale);

//////////////////////////////////////////////////
// 抬高
//////////////////////////////////////////////////

model.position.y += 0.5;

//////////////////////////////////////////////////
// ⭐ 控制器中心修复
//////////////////////////////////////////////////

controls.target.set(0,0,0);

controls.update();

},

(xhr)=>{

console.log(
"加载进度:",
(xhr.loaded/xhr.total*100).toFixed(1)+"%"
);

},

(error)=>{

console.error(error);

}
);

//////////////////////////////////////////////////
// 动画
//////////////////////////////////////////////////

function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

//////////////////////////////////////////////////
// 自适应
//////////////////////////////////////////////////

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
