<!-- 青花瓷 3D 数字博物馆（修复版） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>青花瓷 3D 数字博物馆</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
overflow:hidden;
background:radial-gradient(circle at top,#1b2a41 0%,#050505 60%);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
}
canvas{display:block;}

.loading{
position:fixed;inset:0;
display:flex;justify-content:center;align-items:center;
background:#050505;color:white;font-size:18px;
z-index:999;
}

.title{
position:fixed;top:24px;left:50%;
transform:translateX(-50%);
color:#fff;font-size:28px;z-index:10;
}

.info{
position:fixed;left:40px;bottom:40px;
width:280px;padding:20px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(14px);
color:#fff;border-radius:16px;
z-index:10;
}
</style>
</head>

<body>

<div class="loading" id="loading">模型加载中...</div>

<div class="title">青花瓷数字博物馆</div>

<div class="info">
<h2>元代青花瓷</h2>
<p>数字化三维展示 · Three.js 实时渲染</p >
</div>

<!-- THREE -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const camera = new THREE.PerspectiveCamera(
45, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// 光
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

// loader
const loader = new THREE.GLTFLoader();

console.log("开始加载模型...");

// ✅ 关键修复点：路径必须正确
loader.load(
  './qinghuaci.glb',   // 👈 你仓库根目录
  function(gltf){

    const model = gltf.scene;
    scene.add(model);

    // 自动居中
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    // 缩放
    const size = box.getSize(new THREE.Vector3());
    const max = Math.max(size.x,size.y,size.z);
    model.scale.setScalar(2/max);

    document.getElementById("loading").style.display="none";

    console.log("模型加载成功");

  },
  function(xhr){
    console.log("加载进度:", (xhr.loaded/xhr.total*100).toFixed(1)+"%");
  },
  function(err){
    console.error("加载失败:", err);
    document.getElementById("loading").innerHTML =
      "模型加载失败（检查路径或Vercel部署）";
  }
);

// render loop
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
