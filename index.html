<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>青花瓷 3D 数字博物馆</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;

background:
radial-gradient(circle at top,#1b2a41 0%,#050505 60%);

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;
}

canvas{
display:block;
}

.title{

position:fixed;

top:24px;
left:50%;

transform:translateX(-50%);

color:white;

font-size:30px;

font-weight:600;

letter-spacing:4px;

text-shadow:0 0 20px rgba(0,0,0,.6);

z-index:10;

pointer-events:none;
}

.subTitle{

position:fixed;

top:64px;
left:50%;

transform:translateX(-50%);

color:rgba(255,255,255,.55);

font-size:13px;

letter-spacing:3px;

z-index:10;

pointer-events:none;
}

.loading{

position:fixed;

inset:0;

display:flex;

justify-content:center;
align-items:center;

background:#050505;

color:white;

font-size:20px;

z-index:100;
}

.info{

position:fixed;

left:40px;
bottom:40px;

width:280px;

padding:22px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(16px);

border-radius:22px;

color:white;

z-index:10;
}

.info h2{

font-size:24px;

margin-bottom:10px;

font-weight:600;
}

.info p{

line-height:1.9;

font-size:14px;

opacity:.72;
}

.glow{

position:fixed;

width:500px;
height:500px;

background:
radial-gradient(circle,
rgba(77,166,255,.18) 0%,
transparent 70%);

filter:blur(80px);

top:-100px;
right:-100px;

pointer-events:none;

z-index:0;
}

@media (max-width:768px){

.title{

font-size:22px;
top:20px;
}

.subTitle{

top:54px;
font-size:11px;
}

.info{

left:16px;
bottom:16px;

width:calc(100% - 32px);

padding:18px;
}

}

</style>
</head>

<body>

<div class="loading" id="loading">
正在加载数字展馆...
</div>

<div class="glow"></div>

<div class="title">
青花瓷数字博物馆
</div>

<div class="subTitle">
QINGHUA PORCELAIN DIGITAL MUSEUM
</div>

<div class="info">

<h2>元代青花瓷</h2>

<p>
青花瓷以钴料绘制纹饰，
釉色温润，层次丰富。<br><br>

数字化展览结合实时渲染技术，
还原文物的空间质感与艺术氛围。
</p >

</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<!-- OrbitControls -->
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- GLTFLoader -->
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

//////////////////////////////////////////////////
// 场景
//////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x050505);

scene.fog =
new THREE.Fog(0x050505,8,18);

//////////////////////////////////////////////////
// 相机
//////////////////////////////////////////////////

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,1.2,4.2);

//////////////////////////////////////////////////
// 渲染器
//////////////////////////////////////////////////

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:true

});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.outputEncoding =
THREE.sRGBEncoding;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
renderer.domElement
);

//////////////////////////////////////////////////
// 控制器
//////////////////////////////////////////////////

const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.autoRotate = true;

controls.autoRotateSpeed = 0.8;

controls.minDistance = 2;

controls.maxDistance = 8;

controls.maxPolarAngle =
Math.PI / 1.5;

//////////////////////////////////////////////////
// 灯光
//////////////////////////////////////////////////

const ambientLight =
new THREE.AmbientLight(
0xffffff,
0.45
);

scene.add(ambientLight);

//////////////////////////////////////////////////
// 主聚光灯
//////////////////////////////////////////////////

const spotLight =
new THREE.SpotLight(
0xffffff,
12,
30,
0.28,
0.5
);

spotLight.position.set(0,8,4);

spotLight.castShadow = true;

spotLight.shadow.mapSize.width = 2048;
spotLight.shadow.mapSize.height = 2048;

scene.add(spotLight);

//////////////////////////////////////////////////
// 蓝色轮廓灯
//////////////////////////////////////////////////

const rimLight =
new THREE.DirectionalLight(
0x4da6ff,
2
);

rimLight.position.set(-5,3,-5);

scene.add(rimLight);

//////////////////////////////////////////////////
// 暖色辅助灯
//////////////////////////////////////////////////

const warmLight =
new THREE.PointLight(
0xffd7aa,
1.5
);

warmLight.position.set(3,2,3);

scene.add(warmLight);

//////////////////////////////////////////////////
// 地面
//////////////////////////////////////////////////

const floor =
new THREE.Mesh(

new THREE.CircleGeometry(10,64),

new THREE.MeshStandardMaterial({

color:0x111111,

roughness:0.15,

metalness:0.35

})

);

floor.rotation.x = -Math.PI/2;

floor.position.y = -1.4;

floor.receiveShadow = true;

scene.add(floor);

//////////////////////////////////////////////////
// 漂浮粒子
//////////////////////////////////////////////////

const particlesGeometry =
new THREE.BufferGeometry();

const particleCount = 1200;

const positions = [];

for(let i=0;i<particleCount;i++){

positions.push(
(Math.random()-0.5)*20
);

positions.push(
Math.random()*10
);

positions.push(
(Math.random()-0.5)*20
);

}

particlesGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(
positions,
3
)
);

const particlesMaterial =
new THREE.PointsMaterial({

size:0.02,

transparent:true,

opacity:0.35,

color:0xffffff

});

const particles =
new THREE.Points(
particlesGeometry,
particlesMaterial
);

scene.add(particles);

//////////////////////////////////////////////////
// 加载GLB
//////////////////////////////////////////////////

const loader =
new THREE.GLTFLoader();

loader.load(

'./model/qinghuaci.glb',

function(gltf){

const model = gltf.scene;

//////////////////////////////////////////////////
// 自动居中
//////////////////////////////////////////////////

const box =
new THREE.Box3()
.setFromObject(model);

const center =
box.getCenter(
new THREE.Vector3()
);

const size =
box.getSize(
new THREE.Vector3()
);

const maxDim =
Math.max(
size.x,
size.y,
size.z
);

const scale =
3 / maxDim;

model.scale.setScalar(scale);

model.position.sub(
center.multiplyScalar(scale)
);

//////////////////////////////////////////////////
// 悬浮感
//////////////////////////////////////////////////

model.position.y += 0.3;

//////////////////////////////////////////////////
// 阴影 + 材质
//////////////////////////////////////////////////

model.traverse((obj)=>{

if(obj.isMesh){

obj.castShadow = true;

obj.receiveShadow = true;

if(obj.material){

obj.material.roughness = 0.22;

obj.material.metalness = 0.04;

}

}

});

scene.add(model);

//////////////////////////////////////////////////
// 关闭loading
//////////////////////////////////////////////////

document.getElementById(
'loading'
).style.display='none';

},

undefined,

function(error){

console.error(error);

document.getElementById(
'loading'
).innerHTML='模型加载失败';

}

);

//////////////////////////////////////////////////
// 动画
//////////////////////////////////////////////////

function animate(){

requestAnimationFrame(animate);

controls.update();

particles.rotation.y += 0.0003;

renderer.render(
scene,
camera
);

}

animate();

//////////////////////////////////////////////////
// 自适应
//////////////////////////////////////////////////

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
